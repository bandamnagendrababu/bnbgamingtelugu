<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>

/* =========================================
   BNB GAMING TELUGU - HOME PAGE CSS
   DESKTOP + MOBILE RESPONSIVE
   ========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================
   MAIN HOME PAGE
   ========================================= */

.body {
    width: 890px;
    max-width: 100%;
    min-height: 460px;
    margin: 0 auto;
    background: url("fire.jpg") center/cover no-repeat;
}


/* =========================================
   GREEN HEADER
   ========================================= */

.head {
    background-color: olive;
    width: 100%;
    height: 25vh;
    min-height: 180px;
    position: relative;
}


/* =========================================
   TITLE
   ========================================= */

h1 {
    margin-left: 7px;
    margin-top: 10px;
    display: inline-flex;
    font-size: 57px;
    font-weight: bold;
    color: white;
}


/* =========================================
   HEADER IMAGES
   ========================================= */

#img1 {
    display: flex;
    width: 140px;
    height: auto;
    margin-top: -100px;
}

#img2 {
    display: flex;
    width: 140px;
    height: auto;
    margin-top: -90px;
    margin-left: 500px;
}


/* =========================================
   WELCOME TEXT
   ========================================= */

#welcome {
    display: flex;
    margin-left: 180px;
    margin-top: 15px;
    font-size: 50px;
    color: white;
}


/* =========================================
   SUBSCRIBE BUTTON
   ========================================= */

#subsribe {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-left: 50%;
    margin-top: -100px;

    width: 17%;
    height: 50px;

    border-radius: 30px;
    border: 2px solid yellow;

    font-size: 30px;
    cursor: pointer;

    color: white;
    background: transparent;
}

a {
    text-decoration: none !important;
}


/* =========================================
   LOGOUT BUTTON
   ========================================= */

#logout {
    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 28px;

    width: 10%;
    height: 35px;

    border: 2px solid yellow;
    border-radius: 10px;

    background: transparent;
    color: white;

    cursor: pointer;

    margin-left: 80%;
    margin-top: -40px;

    font-weight: bold;
}


/* =========================================
   DESKTOP GRID
   ========================================= */

#box {
    display: grid;

    grid-template-columns: repeat(3, 150px);

    align-items: center;
    justify-content: center;

    margin: 15%;
    gap: 250px;
}


/* =========================================
   SHORTS / VIDEOS / LIVE
   ========================================= */

#shorts,
#videos,
#live {
    width: 150px;
    height: 100px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    border: 2px solid goldenrod;
    border-radius: 30px;

    background: yellow;
    color: orchid;

    font-weight: bold;
    font-size: 20px;

    margin-top: -23px;
}


/* =========================================
   MOBILE RESPONSIVE
   ========================================= */

@media screen and (max-width: 768px) {

    html,
    body {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }


    /* Main page */
    .body {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        margin: 0;
    }


    /* Green header */
    .head {
        width: 100%;
        height: auto;
        min-height: 250px;
        padding: 10px;

        text-align: center;
    }


    /* Title */
    h1 {
        display: block;

        margin: 5px auto;

        font-size: 32px;

        text-align: center;
    }


    /* Header images */
    #img1,
    #img2 {
        display: block;

        width: 75px;
        height: auto;

        margin: 5px auto;
    }


    /* Welcome */
    #welcome {
        display: block;

        margin: 10px auto;

        font-size: 25px;

        text-align: center;
    }


    /* Subscribe */
    #subsribe {
        display: flex;

        justify-content: center;
        align-items: center;

        width: 160px;
        height: 45px;

        margin: 15px auto;

        font-size: 20px;
    }


    /* Logout */
    #logout {
        display: flex;

        justify-content: center;
        align-items: center;

        width: 110px;
        height: 40px;

        margin: 10px auto;

        font-size: 20px;
    }


    /* Mobile grid */
    #box {
        display: grid;

        grid-template-columns: 1fr;

        gap: 20px;

        width: 100%;

        margin: 30px auto;
    }


    /* Mobile buttons */
    #shorts,
    #videos,
    #live {
        width: 180px;
        height: 80px;

        margin: 0 auto;

        font-size: 18px;
    }
}


/* =========================================
   SMALL MOBILE PHONES
   ========================================= */

@media screen and (max-width: 400px) {

    h1 {
        font-size: 27px;
    }


    #welcome {
        font-size: 22px;
    }


    #img1,
    #img2 {
        width: 60px;
    }


    #subsribe {
        width: 150px;
        height: 42px;

        font-size: 18px;
    }


    #logout {
        width: 100px;
        height: 36px;

        font-size: 18px;
    }


    #shorts,
    #videos,
    #live {
        width: 160px;
        height: 70px;
    }
}

    </style>
</head>
<body>
    <div class="head">
    <h1>  <em>BNB GAMING TELUGU </em> </h1>

     <div id="welcome">
        <em>WELCOME</em>
    </div>
    <a href="https://www.youtube.com/@bnbgamingtelugu?sub_confirmation=1">
    <button onclick="subscribe" id="subsribe">🔔SUBSCRIBE</button>
    </a>

    <button onclick="logout()" id="logout">LOGOUT</button>
    </div>
                        <hr>

                       
     <img src="images/ff2.png" alt="" id="img1">
     <img src="images/ff2.png" alt="" id="img2">
    <ol id="box">
        <button onclick="Albums()" id="shorts">
            <a href="https://www.youtube.com/@bnbgamingtelugu/shorts">SHORTS</a>
        </button>

        <button onclick="Videos()" id="videos">
            <a href="https://www.youtube.com/@bnbgamingtelugu/videos">VIDEOS</a>
        </button>

        <button onclick="Live()" id="live">
            <a href="https://www.youtube.com/@bnbgamingtelugu/live">LIVE</a>
        </button>
    </ol>
    <script>
        function logout (){
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
