<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
      /* ================================
   HOME PAGE MOBILE RESPONSIVE
   ================================ */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

/* Main body */
.body {
    width: 100%;
    max-width: 890px;
    min-height: 460px;
    height: auto;
    margin: 0 auto;
    background: url("fire.jpg") center/cover no-repeat;
}

/* Header */
.head {
    width: 100%;
    min-height: 180px;
    height: auto;
    padding: 10px;
    position: relative;
}

/* Main heading */
h1 {
    margin: 0;
    font-size: 57px;
    font-weight: bold;
    color: white;
}

/* Images */
#img1,
#img2 {
    width: 140px;
    height: auto;
}

/* Welcome text */
#welcome {
    margin: 15px auto;
    text-align: center;
    justify-content: center;
    font-size: 50px;
    color: white;
}

/* Subscribe */
#subsribe {
    margin: 10px auto;
    width: 180px;
    height: 50px;
    justify-content: center;
    align-items: center;
    border-radius: 30px;
    border: 2px solid yellow;
    font-size: 22px;
    cursor: pointer;
    color: white;
    background: transparent;
}

/* Logout */
#logout {
    margin: 15px auto;
    width: 120px;
    height: 40px;
    justify-content: center;
    align-items: center;
    border: 2px solid yellow;
    border-radius: 10px;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 20px;
}

/* Menu boxes */
#box {
    display: grid;
    grid-template-columns: repeat(3, 150px);
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin: 40px auto;
}

/* Shorts / Videos / Live */
#shorts,
#videos,
#live {
    width: 150px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: 2px solid goldenrod;
    border-radius: 30px;
    background: yellow;
    color: orchid;
    font-weight: bold;
    font-size: 20px;
    margin: 0;
}


/* =================================
   MOBILE
   ================================= */

@media screen and (max-width: 768px) {

    html,
    body {
        width: 100%;
        min-width: 100%;
        overflow-x: hidden;
    }

    .body {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        margin: 0;
    }

    .head {
        width: 100%;
        min-height: 250px;
        padding: 10px;
        text-align: center;
    }

    h1 {
        font-size: 32px;
        margin: 5px auto;
        display: block;
    }

    #img1,
    #img2 {
        width: 80px;
        margin: 5px auto;
    }

    #welcome {
        margin: 10px auto;
        font-size: 25px;
        line-height: 1.2;
    }

    #subsribe {
        width: 160px;
        height: 45px;
        margin: 15px auto;
        font-size: 18px;
    }

    #logout {
        width: 110px;
        height: 38px;
        margin: 10px auto;
        font-size: 18px;
    }

    #box {
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 30px auto;
        width: 100%;
    }

    #shorts,
    #videos,
    #live {
        width: 180px;
        height: 80px;
        margin: 0 auto;
        font-size: 18px;
    }
}


/* Small phones */
@media screen and (max-width: 400px) {

    h1 {
        font-size: 28px;
    }

    #welcome {
        font-size: 22px;
    }

    #img1,
    #img2 {
        width: 65px;
    }

    #box {
        gap: 15px;
    }

    #shorts,
    #videos,
    #live {
        width: 160px;
        height: 70px;
    }
}
    </style>
</head>
<body>
    <div class="head">
    <h1>  <em>BNB GAMING TELUGU </em> </h1>

     <div id="welcome">
        <em>WELCOME</em>
    </div>
    <a href="https://www.youtube.com/@bnbgamingtelugu?sub_confirmation=1">
    <button onclick="subscribe" id="subsribe">🔔SUBSCRIBE</button>
    </a>

    <button onclick="logout()" id="logout">LOGOUT</button>
    </div>
                        <hr>

                       
     <img src="images/ff2.png" alt="" id="img1">
     <img src="images/ff2.png" alt="" id="img2">
    <ol id="box">
        <button onclick="Albums()" id="shorts">
            <a href="https://www.youtube.com/@bnbgamingtelugu/shorts">SHORTS</a>
        </button>

        <button onclick="Videos()" id="videos">
            <a href="https://www.youtube.com/@bnbgamingtelugu/videos">VIDEOS</a>
        </button>

        <button onclick="Live()" id="live">
            <a href="https://www.youtube.com/@bnbgamingtelugu/live">LIVE</a>
        </button>
    </ol>
    <script>
        function logout (){
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
